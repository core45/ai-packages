name: CI

# This workflow exists to give the standalone core45/ai-core repo (published
# via `git subtree split` from this monorepo's packages/ai-core/ directory)
# its own CI. Inside this monorepo it is inert: GitHub Actions only reads
# workflow files under .github/workflows/ at the repository root, so this
# file has no effect here. All paths below are relative to the package
# directory itself, because in the split repo the package root IS the repo
# root.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Both ends of the declared range. Without a committed lockfile — correct
    # for a library — `composer install` behaves like `composer update` and
    # always resolves to the top, so the constraints this package PUBLISHES were
    # never the ones tested. The floor job is what makes `^13.0` / `^5.7` a
    # claim rather than a hope.
    strategy:
      fail-fast: false
      matrix:
        dependencies: ['highest', 'lowest']

    name: test (${{ matrix.dependencies }} deps)

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-dist --no-interaction --no-progress
          fi

      - name: Tests
        run: vendor/bin/phpunit
