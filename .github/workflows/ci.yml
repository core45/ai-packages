name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # Pinned deliberately rather than expressed as a range. Filament behaviour
    # the packages rely on is verified against 5.7.6 specifically, so CI proves
    # the matrix that was actually checked instead of one asserted from memory.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Formatting
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/pest

      # The packages exist to be installable in any host application. A package
      # that imports an App\ class is not, so this is a build failure and not a
      # style nit. PackageWiringTest covers ai-posts from the inside; this
      # catches the other four and any new package added later.
      - name: No host coupling
        run: |
          if grep -rn --include='*.php' '^use App\\' packages/*/src packages/*/config packages/*/database 2>/dev/null; then
            echo "::error::A package imports an App\\ class. Route it through ModelRegistry or a contract in src/Contracts/."
            exit 1
          fi
          echo "No App\\ imports in any package."

      # Laravel's Migrator keys the `migrations` ledger on BASENAME, not path,
      # and both ways of getting that wrong fail silently:
      #
      #   - the same basename in two packages -> one ledger row, so the second
      #     migration never runs and nothing says so;
      #   - two basenames creating one table -> two ledger rows, both run, and a
      #     FRESH install throws "table already exists" while an existing one
      #     upgrades fine. It passes where you test it and breaks where you ship.
      #
      # The second is not hypothetical: merging the 00bb fork brought in a second
      # create_content_similarity_checks_table migration under a different
      # timestamp, and nothing in the existing checks would have caught it.
      - name: No migration collisions
        run: php scripts/check-migration-collisions.php

      # D20: the five domain packages must install into an app with no Filament,
      # or one on a different panel. Filament lives only in the *-filament
      # packages. This is the gate that keeps that true — an `implements
      # HasLabel` or a `Notification::make()` added back would otherwise
      # reintroduce the dependency silently, and nothing else would fail.
      #
      # One documented exception: AIImprovementAppliedNotification aliases two
      # Filament classes to build a richer payload than the NotifiesOperator
      # seam carries. A `use` statement is a compile-time alias and triggers no
      # autoload, and the class guards on class_exists() before touching them,
      # so it stays loadable with no Filament installed.
      - name: No Filament in domain packages
        run: |
          if grep -rn --include='*.php' '^use Filament' \
              packages/ai-core/src packages/ai-posts/src packages/ai-chat/src \
              packages/ai-products/src packages/ai-webinars/src 2>/dev/null \
              | grep -v 'ai-core/src/Notifications/AIImprovementAppliedNotification.php'; then
            echo "::error::A domain package imports Filament. Move the UI to core45/ai-core-filament, or route it through a contract in ai-core/src/Contracts/."
            exit 1
          fi
          echo "No Filament imports in the domain packages."

          if grep -rn '"filament/' packages/ai-core/composer.json packages/ai-posts/composer.json \
              packages/ai-chat/composer.json packages/ai-products/composer.json \
              packages/ai-webinars/composer.json 2>/dev/null; then
            echo "::error::A domain package requires a filament/* package. That dependency belongs in a *-filament package."
            exit 1
          fi
          echo "No filament/* requirements in the domain packages."
